<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Chat em Tempo Real</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
  <div id="auth-container" class="chat-container">
    <h2 id="auth-title">🔐 Acesso ao Chat</h2>
    
    <div class="input-area">
      <input type="email" id="auth-email" placeholder="Seu e-mail..." />
      <input type="password" id="auth-password" placeholder="Sua senha..." />
      
      <button id="login-btn">Entrar</button>
      <button id="register-btn" class="btn-secondary">Cadastrar Nova Conta</button>
      
      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <!-- CAIXA PRINCIPAL DO CHAT (INICIA OCULTA) -->
  <div id="chat-container" class="chat-container" style="display: none;">
    <div class="chat-header">
      <h2>💬 Chat da Turma</h2>
      <button id="logout-btn" class="btn-logout">Sair</button>
    </div>

    <!-- MENSAGENS -->
    <div id="chat-box" class="chat-box"></div>

    <!-- ÁREA DE ENTRADA -->
    <div class="input-area">
      <!-- Exibe o usuário autenticado -->
      <p id="user-display" class="user-info"></p>
      
      <input type="text" id="message" placeholder="Digite sua mensagem..." />
      <button id="send-btn">Enviar</button>
    </div>
  </div>

  <!-- SDKs do Firebase (SDK v8 Compatível) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
 
  <script src="script.js"></script>
</body>
</html>
